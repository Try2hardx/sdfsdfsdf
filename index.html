<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday CC!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ead2bd;--paper:#fff8f1;--ink:#3a1c10;--muted:#7a5240;--a:#7b3f1d;--b:#d9a05b;--c:#ff7aa8;--line:#d9bba2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24110a;--paper:#3a1c10;--ink:#f6e3d3;--muted:#c9a58c;--a:#d98a4e;--b:#e8b36a;--c:#ff8fb3;--line:#5a3322}}
:root[data-theme="dark"]{--bg:#24110a;--paper:#3a1c10;--ink:#f6e3d3;--muted:#c9a58c;--a:#d98a4e;--b:#e8b36a;--c:#ff8fb3;--line:#5a3322}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
main{position:relative;max-width:560px;margin:0 auto;padding:78px 16px 48px}
[hidden]{display:none!important}
.card{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:28px 22px 26px;text-align:center;box-shadow:8px 8px 0 var(--a);overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:repeating-linear-gradient(90deg,var(--a) 0 28px,var(--b) 28px 56px,var(--c) 56px 84px)}
h1{font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.05;margin:14px 0 4px;letter-spacing:-.01em}
h1 .name{color:var(--a)}
.msg{max-width:42ch;margin:10px auto 0;font-size:1.08rem}
svg.cake{width:min(260px,70%);height:auto;margin:6px auto 0;display:block;overflow:visible}
.flame{transform-origin:center bottom;transform-box:fill-box;animation:flick .5s ease-in-out infinite alternate;transition:opacity .3s}
.flame:nth-of-type(2){animation-delay:.15s}.flame:nth-of-type(3){animation-delay:.3s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.15) rotate(3deg)}}
.out .flame{opacity:0;animation:none}
.smoke{opacity:0}
.out .smoke{animation:puff 1.4s ease-out forwards}
@keyframes puff{from{opacity:.7;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .12s,background .2s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.primary{background:var(--a);color:#fff8f1}
:root[data-theme="dark"] .primary{color:#24110a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#24110a}}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
/* captcha */
.veil{position:fixed;inset:0;z-index:20;background:rgba(20,10,40,.6);display:grid;place-items:center;padding:16px}
.cap{background:var(--paper);border:3px solid var(--ink);border-radius:18px;width:min(340px,100%);padding:16px;box-shadow:6px 6px 0 var(--b)}
.cap h2{font-family:Fredoka,sans-serif;font-size:1.1rem;margin:0 0 12px}
.robot{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);font-weight:500}
.chk{width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;font-size:18px;color:var(--c)}
.chk.spin{border-radius:50%;border-color:var(--line);border-top-color:var(--a);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:1;font-size:2.4rem;padding:0;border-radius:10px;border:3px solid transparent;background:var(--bg);position:relative}
.tile[aria-pressed="true"]{border-color:var(--a);background:var(--paper)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:2px;right:6px;font-size:.9rem;color:#fff;background:var(--a);border-radius:50%;width:20px;height:20px;line-height:20px}
.err{color:var(--a);min-height:1.4em;font-size:.9rem;margin:8px 0 0;font-weight:700}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cap .primary{width:100%;margin-top:6px}
/* present page */
.photo{width:100%;max-width:340px;margin:14px auto 0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;box-shadow:6px 6px 0 var(--c)}
.photo svg{display:block;width:100%;height:auto}
.lily{transform-origin:447px 224px;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.present{font-family:Fredoka,sans-serif;font-size:1.7rem;margin:18px 0 2px}
.ask{font-size:1.1rem;margin:0}
.yay{font-family:Fredoka,sans-serif;font-size:clamp(2rem,10vw,3.2rem);color:var(--a);margin:18px 0 0;word-break:break-word}
#no{position:relative}
#no.run{position:fixed;z-index:15;transition:left .18s,top .18s}
/* cat easter egg */
.cat{position:absolute;top:22px;right:56px;z-index:5;width:72px;padding:0;border:0;background:none;border-radius:12px;cursor:pointer;line-height:0}
.cat:hover{transform:none}
.cat svg{width:100%;height:auto;overflow:visible}
.cat .tail{transform-origin:62px 54px;transform-box:view-box;animation:wag 1.6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
.cat .eyes{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.cat.happy .eyes{animation:none}
.bub{position:absolute;right:calc(56px + 54px);top:6px;z-index:6;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:1px 9px;font-weight:700;font-size:.85rem;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.bub.show{opacity:1;transform:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.flame,.out .smoke,.chk.spin,.shake,.lily,.cat .tail,.cat .eyes{animation:none}button:hover{transform:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <button class="cat" id="cat" aria-label="A small brown cat. Pet it.">
    <svg viewBox="0 0 80 62" aria-hidden="true">
      <g stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <path class="tail" d="M60 56C76 56 78 40 70 34" fill="none" stroke-width="5"/>
        <path d="M18 60C14 44 22 34 36 34S58 44 54 60Z" fill="#8b5a3c"/>
        <path d="M30 60C29 52 32 46 36 46S43 52 42 60Z" fill="#c9a07a" stroke-width="1.5"/>
        <path d="M17 24L19 6L30 15C34 14 38 14 42 15L53 6L55 24C57 38 47 44 36 44S15 38 17 24Z" fill="#8b5a3c"/>
        <path d="M21 14L23 11L26 14Z M50 14L49 11L46 14Z" fill="#e8a5a5" stroke="none"/>
        <path d="M30 20L30 26M36 18L36 25M42 20L42 26" stroke="#6b4128" stroke-width="2" fill="none"/>
      </g>
      <g class="eyes" fill="#111"><ellipse cx="28" cy="31" rx="2.6" ry="3.4"/><ellipse cx="44" cy="31" rx="2.6" ry="3.4"/></g>
      <path d="M34 36L38 36L36 38.5Z" fill="#d98a8a" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M36 38.5Q33 42 30 40M36 38.5Q39 42 42 40" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M22 37L10 35M22 40L10 42M50 37L62 35M50 40L62 42" stroke="#111" stroke-width="1.1" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="bub" id="bub" role="status"></div>
  <section class="card" id="card">
    <svg class="cake" viewBox="0 0 220 200" role="img" aria-label="Chocolate birthday cake with three candles">
      <ellipse cx="110" cy="186" rx="100" ry="10" fill="var(--ink)" opacity=".15"/>
      <rect x="30" y="120" width="160" height="62" rx="12" fill="#5a2d17" stroke="var(--ink)" stroke-width="3"/>
      <rect x="55" y="82" width="110" height="44" rx="10" fill="#7b3f1d" stroke="var(--ink)" stroke-width="3"/>
      <path d="M55 96q14 16 27 0t27 0 27 0 29 0v-4a10 10 0 0 0-10-10H65a10 10 0 0 0-10 10z" fill="#f6dcc2" stroke="var(--ink)" stroke-width="3"/>
      <path d="M30 134q20 16 40 0t40 0 40 0 40 0" fill="none" stroke="#f6dcc2" stroke-width="7" stroke-linecap="round"/>
      <g stroke="var(--ink)" stroke-width="3">
        <rect x="82" y="54" width="10" height="30" rx="3" fill="var(--a)"/>
        <rect x="105" y="50" width="10" height="34" rx="3" fill="var(--c)"/>
        <rect x="128" y="54" width="10" height="30" rx="3" fill="var(--a)"/>
      </g>
      <path class="flame" d="M87 50c-7-8-3-16 0-22 3 6 7 14 0 22z" fill="#ffb703" stroke="var(--ink)" stroke-width="2"/>
      <path class="flame" d="M110 46c-7-8-3-16 0-22 3 6 7 14 0 22z" fill="#ffb703" stroke="var(--ink)" stroke-width="2"/>
      <path class="flame" d="M133 50c-7-8-3-16 0-22 3 6 7 14 0 22z" fill="#ffb703" stroke="var(--ink)" stroke-width="2"/>
      <g class="smoke" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round">
        <path d="M87 44q-6-8 0-14"/><path d="M110 40q-6-8 0-14"/><path d="M133 44q-6-8 0-14"/>
      </g>
    </svg>
    <h1>Happy Birthday<br><span class="name">CC</span>!</h1>
    <p class="msg">Wishing you a day as rich and sweet as you make everyone else's. Chocolate first, questions later.</p>
    <div class="actions">
      <button id="blow">Blow out candles</button>
      <button class="primary" id="gift">Click here for your birthday present</button>
    </div>
  </section>

  <section class="card" id="page2" hidden>
    <h1>Surprise!</h1>

<script>
const $=id=>document.getElementById(id);
/* ---------- confetti ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let ps=[],raf=0;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",size);size();
function burst(n=140){
  if(reduce)return;
  const cs=["#7b3f1d","#d9a05b","#ff7aa8","#5a2d17","#f6dcc2"],d=devicePixelRatio;
  for(let i=0;i<n;i++)ps.push({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*14-4)*d,
    w:(6+Math.random()*6)*d,h:(4+Math.random()*5)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cs[i%cs.length],g:.32*d});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  ps=ps.filter(p=>p.y<cv.height+40);
  raf=ps.length?requestAnimationFrame(tick):0;
  if(!ps.length)cx.clearRect(0,0,cv.width,cv.height);
}
/* ---------- cat ---------- */
const meows=["meow!","mrrp?","purr…","mew!","prrr ♥"];let mi=0,bt;
$("cat").onclick=()=>{
  const b=$("bub");b.textContent=meows[mi++%meows.length];b.classList.add("show");
  $("cat").classList.add("happy");clearTimeout(bt);
  bt=setTimeout(()=>{b.classList.remove("show");$("cat").classList.remove("happy")},1500);
};
/* ---------- candles ---------- */
$("blow").onclick=()=>{
  const out=$("card").classList.toggle("out");
  $("blow").textContent=out?"Light them again":"Blow out candles";
  if(out)burst(160);
};
/* ---------- captcha ---------- */
const CHOC="🍫",OTHERS=["🍕","🍔","🍟","🍎","🍓","🍌","🍉","🥕","🍞","🧀","🍦","🍇","🥐","🌽"];
let tiles=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildGrid(){
  const k=3+Math.floor(Math.random()*2);
  tiles=shuffle([...Array(k).fill(CHOC),...shuffle([...OTHERS]).slice(0,9-k)]);
  const g=$("grid");g.innerHTML="";
  tiles.forEach((e,i)=>{
    const b=document.createElement("button");
    b.className="tile";b.textContent=e;b.setAttribute("aria-pressed","false");
    b.setAttribute("aria-label",e===CHOC?"Chocolate":"Not chocolate");
    b.onclick=()=>{b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");$("err").textContent=""};
    g.appendChild(b);
  });
}
$("gift").onclick=()=>{
  $("veil").hidden=false;$("step1").hidden=false;$("step2").hidden=true;
  $("chk").className="chk";$("chk").textContent="";$("chk").focus();
};
$("chk").onclick=()=>{
  const c=$("chk");c.className="chk spin";
  setTimeout(()=>{c.className="chk";c.textContent="✓";
    setTimeout(()=>{$("step1").hidden=true;$("step2").hidden=false;buildGrid()},350)},reduce?100:900);
};
$("verify").onclick=()=>{
  const sel=[...document.querySelectorAll(".tile")].map(b=>b.getAttribute("aria-pressed")==="true");
  const ok=sel.every((s,i)=>s===(tiles[i]===CHOC));
  if(ok){
    $("veil").hidden=true;$("card").hidden=true;$("page2").hidden=false;scrollTo(0,0);burst(120);
  }else{
    $("err").textContent="Not quite. Pick every chocolate and try again.";
    $("cap").classList.remove("shake");void $("cap").offsetWidth;$("cap").classList.add("shake");
    setTimeout(buildGrid,450);
  }
};
/* ---------- yes / no ---------- */
$("yes").onclick=()=>{
  $("choices").hidden=true;$("ask").hidden=true;$("yay").hidden=false;
  $("pTitle").textContent="Best present ever";
  burst(220);setTimeout(()=>burst(160),500);
};
const no=$("no");
function dodge(){
  const r=no.getBoundingClientRect(),w=r.width||80,h=r.height||44,pad=12;
  no.classList.add("run");
  const maxX=innerWidth-w-pad,maxY=innerHeight-h-pad;
  let x,y,t=0;
  do{x=pad+Math.random()*Math.max(maxX-pad,0);y=pad+Math.random()*Math.max(maxY-pad,0);t++}
  while(t<12&&Math.hypot(x-r.left,y-r.top)<120);
  no.style.left=x+"px";no.style.top=y+"px";
  if(document.activeElement===no)no.blur();
}
let lastDodge=0;
function tapDodge(e){
  e.preventDefault();e.stopPropagation();
  if(Date.now()-lastDodge<400)return; /* pointerdown and click are one tap */
  lastDodge=Date.now();dodge();
}
["pointerdown","click"].forEach(ev=>no.addEventListener(ev,tapDodge,{passive:false}));
</script>
</body>
